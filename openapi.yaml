openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: YouTube Transcriber API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transcribe
    description: Transcription operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transcribe/video:
    post:
      operationId: transcribeVideo
      tags: [transcribe]
      summary: Transcribe a single YouTube video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeVideoRequest"
      responses:
        "200":
          description: Transcript result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transcription failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcribe/playlist:
    post:
      operationId: transcribePlaylist
      tags: [transcribe]
      summary: Transcribe all videos in a YouTube playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribePlaylistRequest"
      responses:
        "200":
          description: Playlist transcript results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistTranscribeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transcription failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcribe/playlist/info:
    post:
      operationId: getPlaylistInfo
      tags: [transcribe]
      summary: Get playlist metadata and video list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInfoRequest"
      responses:
        "200":
          description: Playlist info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistInfo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TranscribeVideoRequest:
      type: object
      properties:
        url:
          type: string
          description: YouTube video URL
        preferredLanguages:
          type: array
          items:
            type: string
          description: Preferred caption languages (e.g. ['en', 'hi'])
        includeTimestamps:
          type: boolean
          description: Whether to include timestamps in text output
      required:
        - url

    TranscribePlaylistRequest:
      type: object
      properties:
        url:
          type: string
          description: YouTube playlist URL
        preferredLanguages:
          type: array
          items:
            type: string
          description: Preferred caption languages
        includeTimestamps:
          type: boolean
          description: Whether to include timestamps in text output
        maxVideos:
          type: ["integer", "null"]
          description: Maximum number of videos to transcribe (null = all)
      required:
        - url

    PlaylistInfoRequest:
      type: object
      properties:
        url:
          type: string
          description: YouTube playlist URL
      required:
        - url

    TranscriptSegment:
      type: object
      properties:
        start:
          type: number
          description: Start time in seconds
        duration:
          type: number
          description: Duration in seconds
        text:
          type: string
          description: Segment text
      required:
        - start
        - duration
        - text

    VideoMetadata:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        channelName:
          type: string
        duration:
          type: number
          description: Duration in seconds
        thumbnailUrl:
          type: ["string", "null"]
      required:
        - videoId
        - title
        - channelName
        - duration
        - thumbnailUrl

    TranscribeResult:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        channelName:
          type: string
        duration:
          type: number
        thumbnailUrl:
          type: ["string", "null"]
        method:
          type: string
          description: "How the transcript was obtained: manual, auto, unavailable"
        language:
          type: string
          description: Language code of transcript
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        transcriptText:
          type: string
          description: Plain text transcript with optional timestamps
        transcriptSrt:
          type: string
          description: SRT format transcript
      required:
        - videoId
        - title
        - channelName
        - duration
        - thumbnailUrl
        - method
        - language
        - segments
        - transcriptText
        - transcriptSrt

    PlaylistVideoItem:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        channelName:
          type: string
        duration:
          type: number
        thumbnailUrl:
          type: ["string", "null"]
        position:
          type: integer
      required:
        - videoId
        - title
        - channelName
        - duration
        - thumbnailUrl
        - position

    PlaylistInfo:
      type: object
      properties:
        playlistId:
          type: string
        title:
          type: string
        channelName:
          type: string
        videoCount:
          type: integer
        videos:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistVideoItem"
      required:
        - playlistId
        - title
        - channelName
        - videoCount
        - videos

    PlaylistVideoTranscribeResult:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        position:
          type: integer
        success:
          type: boolean
        result:
          $ref: "#/components/schemas/TranscribeResult"
        error:
          type: ["string", "null"]
      required:
        - videoId
        - title
        - position
        - success
        - error

    PlaylistTranscribeResult:
      type: object
      properties:
        playlistId:
          type: string
        playlistTitle:
          type: string
        totalVideos:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistVideoTranscribeResult"
      required:
        - playlistId
        - playlistTitle
        - totalVideos
        - successCount
        - failureCount
        - results
